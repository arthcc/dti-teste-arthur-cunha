name: CI/CD


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  API_URL: https://teste-dti-arthur-api.fly.dev
  WEB_URL: https://teste-dti-arthur-web.fly.dev

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:ci
      - name: Unit tests
        run: npm run test -- --ci
      - name: E2E tests
        run: npm run test:e2e -- --ci
      - name: Build
        run: npm run build

  web:
    name: Web — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}

  deploy-api:
    name: Deploy API (Fly.io)
    needs: [api, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://teste-dti-arthur-api.fly.dev/docs
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        working-directory: backend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Deploy Web (Fly.io)
    needs: [deploy-api]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://teste-dti-arthur-web.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        working-directory: frontend
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke:
    name: Smoke test
    needs: [deploy-api, deploy-web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: API responde
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "$API_URL/drones"
      - name: Front responde
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "$WEB_URL" > /dev/null
