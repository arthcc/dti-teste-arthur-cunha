app = 'teste-dti-arthur-web'
primary_region = 'gru'

[build]
  # O Vite congela a URL da API no bundle durante o build — por isso ela vem
  # como build-arg (e não como env de runtime).
  [build.args]
    VITE_API_URL = 'https://teste-dti-arthur-api.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true

  # nginx estático — poderia dormir, mas mantemos 1 no ar para a demo
  # responder instantaneamente.
  auto_stop_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
