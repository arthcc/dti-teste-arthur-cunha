app = 'teste-dti-arthur-api'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true

  # A simulação vive em memória (Map nos services): parar a máquina apaga
  # frota, pedidos e zonas. Por isso auto_stop desligado e sempre 1 rodando.
  auto_stop_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
